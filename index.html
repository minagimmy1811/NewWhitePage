<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Maria 💌</title>
    <meta name="theme-color" content="#ffd6e8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- moving background -->
    <div class="blobs" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
    </div>
    <div id="floaters" aria-hidden="true"></div>
    <div id="trail" aria-hidden="true"></div>

    <!-- ========== INTRO: the envelope ========== -->
    <section id="intro" class="intro">
        <p class="intro-hint">You've got mail 📬</p>
        <button class="envelope" id="envelope" aria-label="Open the letter">
            <span class="env-back"></span>
            <span class="letter">
                <span class="letter-text">Dear Maria,<br>this is for you 💌</span>
            </span>
            <span class="env-front"></span>
            <span class="env-flap"></span>
            <span class="seal">❤</span>
        </button>
        <p class="intro-tap">tap the envelope</p>
        <p class="intro-note">P.S. every button you press goes straight to him 👀 so choose wisely.</p>
    </section>

    <!-- ========== STAGES ========== -->
    <main class="stage-wrap hidden" id="stageWrap">
        <div class="card" id="card">
            <div class="hearts-progress" id="heartsProgress" aria-hidden="true"></div>
            <p class="stage-label" id="stageLabel"></p>

            <div class="mascot" id="mascot">💌</div>
            <div class="bubble hidden" id="bubble"></div>

            <h1 class="question" id="question"></h1>
            <div class="subtitle" id="subtitle"></div>

            <!-- per-stage extras (mini game, loading bar, timeline...) -->
            <div class="extra" id="extra"></div>

            <div class="buttons" id="buttons">
                <button class="btn yes" id="yesBtn">YES</button>
                <button class="btn no" id="noBtn">NO</button>
            </div>

            <div class="reaction hidden" id="reaction">
                <p class="reaction-text" id="reactionText"></p>
                <button class="btn next" id="nextBtn">Next ➜</button>
            </div>
        </div>
    </main>

    <div class="flash" id="flash" aria-hidden="true"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <script src="script.js"></script>
</body>
</html>
